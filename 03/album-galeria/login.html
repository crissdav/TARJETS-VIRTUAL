<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Álbum privado · XV Años de Grecia</title>
  <meta name="theme-color" content="#F2C4CE">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="mascara-icono.svg">
</head>
<body>

<div class="bg-decor" id="bgDecor" aria-hidden="true"></div>

<div class="login-page">
  <div class="login-card">
    <img class="login-mask" src="mascara-icono.svg" alt="" aria-hidden="true">
    <h1 class="login-title">Mi Álbum de Fotos</h1>
    <p class="login-sub">Álbum privado · Solo Grecia puede entrar</p>

    <form class="login-form" id="loginForm" autocomplete="off">
      <div class="field">
        <label class="field-label" for="email">Correo</label>
        <input class="input input-pass" type="email" id="email" placeholder="tu@correo.com" required>
      </div>
      <div class="field">
        <label class="field-label" for="pass">Contraseña</label>
        <input class="input input-pass" type="password" id="pass" placeholder="••••••••" required>
      </div>
      <button class="btn" type="submit" id="btnEntrar">Entrar</button>
    </form>

    <p class="login-error" id="error"></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="login.js"></script>
</body>
</html>
