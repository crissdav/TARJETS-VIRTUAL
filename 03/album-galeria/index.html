<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Álbum XV — Grecia Peña | Noche de Máscaras</title>
  <meta name="description" content="Álbum privado de fotos de los XV años de Grecia Peña — Noche de Máscaras, 27 de Noviembre, 2026">
  <meta name="theme-color" content="#8B0000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="mascara-icono.svg">
</head>
<body>

<div class="bg-decor" id="bgDecor" aria-hidden="true"></div>

<div class="topbar">
  <span class="logo">XV · Grecia Peña</span>
  <button class="btn-logout" id="btnLogout" type="button">Cerrar sesión</button>
</div>

<div class="page-head">
  <span class="eyebrow">Noche de Máscaras</span>
  <h1>Mi álbum de fotos</h1>
  <p class="sub">Viernes 27 de Noviembre, 2026 · 7:00 p.m.</p>
  <div class="live-bar">
    <span class="live-dot"></span>
    <span id="countFotos" style="font-style: normal; font-weight: 700; color: var(--dorado-light); font-family:'Cinzel',serif;">0</span>
    <span>fotos en el álbum</span>
  </div>
  <div class="head-divider"></div>
</div>

<section class="container">
  <div class="stats glass-card">
    <div class="stat">
      <div class="stats-num" id="statFotos">0</div>
      <div class="stats-label">Fotos</div>
    </div>
    <div class="stat">
      <div class="stats-num" id="statInvitados">0</div>
      <div class="stats-label">Invitados</div>
    </div>
  </div>
</section>

<h2 class="gallery-title">✦ Todas las fotos ✦</h2>

<section class="container">
  <div class="gallery" id="gallery">
    <div class="loading" id="loading">Cargando el álbum…</div>
  </div>
</section>

<footer>
  <p class="gold">Noche de Máscaras · 27 de Noviembre, 2026</p>
  <p>Álbum XV de Grecia Peña</p>
</footer>

<div class="lightbox" id="lightbox">
  <div class="lb-close" id="lbClose">✕</div>
  <img id="lbImg" alt="Foto ampliada">
  <div class="lb-bottom">
    <div class="lb-meta" id="lbMeta"></div>
    <div class="lb-actions">
      <button class="btn" id="lbDescargar" type="button">⬇️ Descargar</button>
      <button class="btn danger" id="lbEliminar" type="button">🗑️ Eliminar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="galeria.js"></script>
</body>
</html>
