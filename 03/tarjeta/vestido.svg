<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" fill="none">
  <defs>
    <linearGradient id="vestido" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="40%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <linearGradient id="vestidoH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#252540"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="vGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="vRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C41E3A"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
    <filter id="vGlow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.3"/></filter>
  </defs>

  <g transform="translate(100,0) scale(1.15,1) translate(-100,0)">

  <!-- Hanger -->
  <path d="M88 8 Q100 0 112 8" fill="none" stroke="#B8860B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="4" x2="100" y2="0" stroke="#B8860B" stroke-width="2"/>

  <!-- Dress bodice -->
  <path d="M72 50 Q70 40 80 32 Q90 26 100 24 Q110 26 120 32 Q130 40 128 50 L130 100 Q130 110 125 115 L75 115 Q70 110 70 100Z" fill="url(#vestido)" stroke="url(#vGold)" stroke-width="1"/>

  <!-- Straps -->
  <path d="M82 32 Q84 20 92 12" fill="none" stroke="url(#vGold)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M118 32 Q116 20 108 12" fill="none" stroke="url(#vGold)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Bodice detail - sweetheart neckline -->
  <path d="M78 48 Q90 56 100 52 Q110 56 122 48" fill="none" stroke="url(#vGold)" stroke-width="0.8" opacity="0.4"/>

  <!-- Gold belt / waist accent -->
  <rect x="70" y="108" width="60" height="8" rx="2" fill="url(#vRed)" opacity="0.7"/>
  <rect x="70" y="108" width="60" height="8" rx="2" fill="none" stroke="url(#vGold)" stroke-width="0.8"/>
  <circle cx="100" cy="112" r="4" fill="url(#vGold)" filter="url(#vGlow)"/>
  <circle cx="100" cy="112" r="2" fill="#C41E3A"/>

  <!-- Skirt - A-line flowing -->
  <path d="M70 116 Q55 180 35 280 Q30 300 28 310 L172 310 Q170 300 165 280 Q145 180 130 116Z" fill="url(#vestido)" stroke="url(#vGold)" stroke-width="0.8"/>

  <!-- Skirt fold lines -->
  <path d="M80 120 Q65 200 45 290" fill="none" stroke="url(#vestidoH)" stroke-width="1.5" opacity="0.4"/>
  <path d="M100 118 Q100 200 95 290" fill="none" stroke="url(#vestidoH)" stroke-width="1" opacity="0.3"/>
  <path d="M120 120 Q135 200 155 290" fill="none" stroke="url(#vestidoH)" stroke-width="1.5" opacity="0.4"/>

  <!-- Skirt shimmer highlights -->
  <path d="M60 160 Q70 155 80 160" fill="none" stroke="#FFF" stroke-width="0.5" opacity="0.08"/>
  <path d="M110 180 Q120 175 130 180" fill="none" stroke="#FFF" stroke-width="0.5" opacity="0.06"/>
  <path d="M50 230 Q65 225 75 235" fill="none" stroke="#FFF" stroke-width="0.5" opacity="0.05"/>

  <!-- Gold lace trim at bottom -->
  <path d="M28 305 Q40 298 55 302 Q70 306 85 302 Q100 298 115 302 Q130 306 145 302 Q160 298 172 305" fill="none" stroke="url(#vGold)" stroke-width="1" opacity="0.5"/>

  <!-- Small mask decoration on belt -->
  <path d="M93 110 Q93 107 97 106 Q100 105.5 103 106 Q107 107 107 110 Q107 113 103 114 Q100 115 97 114 Q93 113 93 110Z" fill="url(#vRed)" opacity="0.6"/>
  <ellipse cx="97" cy="110" rx="2" ry="1.3" fill="#0d0000" opacity="0.5"/>
  <ellipse cx="103" cy="110" rx="2" ry="1.3" fill="#0d0000" opacity="0.5"/>
  </g>

</svg>