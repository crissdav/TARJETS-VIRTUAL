<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <linearGradient id="skin" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F5D0B0"/>
      <stop offset="60%" stop-color="#E8B896"/>
      <stop offset="100%" stop-color="#D4A57A"/>
    </linearGradient>
    <linearGradient id="skinSh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A57A"/>
      <stop offset="100%" stop-color="#C4956A"/>
    </linearGradient>
    <linearGradient id="hair" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2C1810"/>
      <stop offset="50%" stop-color="#1A0E08"/>
      <stop offset="100%" stop-color="#0D0704"/>
    </linearGradient>
    <linearGradient id="hairH" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#3D2517"/>
      <stop offset="100%" stop-color="#2C1810"/>
    </linearGradient>
    <linearGradient id="mGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="mRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C41E3A"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lip" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#C41E3A"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
    <linearGradient id="dress" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="maskClip"><ellipse cx="200" cy="210" rx="120" ry="65"/></clipPath>
  </defs>

  <!-- Hair background -->
  <path d="M80 160 Q60 100 80 60 Q100 20 160 10 Q200 5 240 10 Q300 20 320 60 Q340 100 320 160 L330 300 Q320 340 300 360 L280 380 Q260 400 200 410 Q140 400 120 380 L100 360 Q80 340 70 300Z" fill="url(#hair)" filter="url(#shadow)"/>
  <!-- Hair highlights -->
  <path d="M120 80 Q140 50 180 35" fill="none" stroke="url(#hairH)" stroke-width="6" opacity="0.4"/>
  <path d="M100 110 Q120 70 170 50" fill="none" stroke="url(#hairH)" stroke-width="4" opacity="0.3"/>
  <path d="M280 80 Q260 50 220 35" fill="none" stroke="url(#hairH)" stroke-width="6" opacity="0.4"/>
  <path d="M300 110 Q280 70 230 50" fill="none" stroke="url(#hairH)" stroke-width="4" opacity="0.3"/>
  <!-- Hair strands falling -->
  <path d="M100 200 Q85 250 90 320 Q92 350 105 370" fill="none" stroke="#1A0E08" stroke-width="8" opacity="0.6"/>
  <path d="M110 210 Q95 260 98 330 Q100 355 112 375" fill="none" stroke="#2C1810" stroke-width="5" opacity="0.4"/>
  <path d="M300 200 Q315 250 310 320 Q308 350 295 370" fill="none" stroke="#1A0E08" stroke-width="8" opacity="0.6"/>
  <path d="M290 210 Q305 260 302 330 Q300 355 288 375" fill="none" stroke="#2C1810" stroke-width="5" opacity="0.4"/>

  <!-- Neck -->
  <path d="M175 310 L175 370 Q175 400 160 430 L160 500 L240 500 L240 430 Q225 400 225 370 L225 310" fill="url(#skin)"/>
  <path d="M175 310 L175 370 Q175 400 160 430" fill="none" stroke="url(#skinSh)" stroke-width="1.5" opacity="0.3"/>

  <!-- Face -->
  <ellipse cx="200" cy="230" rx="105" ry="130" fill="url(#skin)" filter="url(#shadow)"/>
  <!-- Cheekbone shading -->
  <ellipse cx="140" cy="250" rx="30" ry="20" fill="#E8A880" opacity="0.3"/>
  <ellipse cx="260" cy="250" rx="30" ry="20" fill="#E8A880" opacity="0.3"/>
  <!-- Jaw shadow -->
  <path d="M140 310 Q200 350 260 310" fill="none" stroke="#C4956A" stroke-width="2" opacity="0.2"/>

  <!-- Eyebrows (above mask) -->
  <path d="M148 185 Q165 178 190 182" fill="none" stroke="#2C1810" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

  <!-- MASQUERADE MASK -->
  <g filter="url(#shadow)">
    <!-- Mask base -->
    <path d="M85 215 Q85 185 120 175 Q150 165 200 180 Q250 165 280 175 Q315 185 315 215 Q315 245 290 258 Q265 268 240 260 Q220 275 200 280 Q180 275 160 260 Q135 268 110 258 Q85 245 85 215Z" fill="url(#mGold)" stroke="#8B6914" stroke-width="2"/>
    <!-- Mask raised area / bridge -->
    <path d="M170 200 Q185 185 200 182 Q215 185 230 200" fill="none" stroke="#FFF" stroke-width="1" opacity="0.2"/>
    <!-- Mask filigree swirls left -->
    <path d="M100 210 Q110 195 125 200 Q130 202 128 210" fill="none" stroke="#FFF" stroke-width="1.2" opacity="0.25"/>
    <path d="M95 225 Q108 218 118 225" fill="none" stroke="#FFF" stroke-width="0.8" opacity="0.2"/>
    <!-- Mask filigree swirls right -->
    <path d="M300 210 Q290 195 275 200 Q270 202 272 210" fill="none" stroke="#FFF" stroke-width="1.2" opacity="0.25"/>
    <path d="M305 225 Q292 218 282 225" fill="none" stroke="#FFF" stroke-width="0.8" opacity="0.2"/>
    <!-- Center jewel -->
    <path d="M195 188 L200 175 L205 188 L200 195Z" fill="url(#mRed)" stroke="#FFD700" stroke-width="1.5"/>
    <circle cx="200" cy="184" r="3" fill="#FFD700" filter="url(#glow)"/>
    <!-- Eye holes -->
    <ellipse cx="160" cy="215" rx="32" ry="20" fill="#0d0000"/>
    <ellipse cx="160" cy="215" rx="32" ry="20" fill="none" stroke="#FFD700" stroke-width="2"/>
    <ellipse cx="160" cy="215" rx="28" ry="16" fill="none" stroke="#FFF" stroke-width="0.5" opacity="0.15"/>
    <ellipse cx="240" cy="215" rx="32" ry="20" fill="#0d0000"/>
    <ellipse cx="240" cy="215" rx="32" ry="20" fill="none" stroke="#FFD700" stroke-width="2"/>
    <ellipse cx="240" cy="215" rx="28" ry="16" fill="none" stroke="#FFF" stroke-width="0.5" opacity="0.15"/>
    <!-- Eyes visible through mask -->
    <ellipse cx="160" cy="217" rx="12" ry="8" fill="#4A2511"/>
    <ellipse cx="240" cy="217" rx="12" ry="8" fill="#4A2511"/>
    <circle cx="160" cy="217" r="5" fill="#2C1810"/>
    <circle cx="240" cy="217" r="5" fill="#2C1810"/>
    <circle cx="157" cy="215" r="2" fill="#FFF" opacity="0.7"/>
    <circle cx="237" cy="215" r="2" fill="#FFF" opacity="0.7"/>
    <circle cx="163" cy="219" r="1" fill="#FFF" opacity="0.4"/>
    <circle cx="243" cy="219" r="1" fill="#FFF" opacity="0.4"/>
    <!-- Lower eyelid shadow -->
    <path d="M132 222 Q160 230 188 222" fill="none" stroke="#C4956A" stroke-width="1" opacity="0.3"/>
    <path d="M212 222 Q240 230 268 222" fill="none" stroke="#C4956A" stroke-width="1" opacity="0.3"/>
    <!-- Red decorative swirls on mask -->
    <path d="M105 205 Q95 190 102 180 Q110 172 118 185" fill="none" stroke="url(#mRed)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M98 218 Q88 208 93 198" fill="none" stroke="url(#mRed)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M295 205 Q305 190 298 180 Q290 172 282 185" fill="none" stroke="url(#mRed)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M302 218 Q312 208 307 198" fill="none" stroke="url(#mRed)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <!-- Pearl accents on mask -->
    <circle cx="130" cy="195" r="3" fill="#FFF" opacity="0.8"/>
    <circle cx="270" cy="195" r="3" fill="#FFF" opacity="0.8"/>
    <circle cx="145" cy="185" r="2" fill="#FFF" opacity="0.6"/>
    <circle cx="255" cy="185" r="2" fill="#FFF" opacity="0.6"/>
  </g>

  <!-- FEATHERS on mask (left) -->
  <g opacity="0.95">
    <path d="M100 185 Q70 130 80 80 Q95 110 110 160" fill="url(#mRed)"/>
    <path d="M90 178 Q55 125 68 72 Q85 105 100 155" fill="#C41E3A" opacity="0.7"/>
    <path d="M110 175 Q85 120 95 75 Q108 105 118 152" fill="#8B0000" opacity="0.6"/>
    <!-- Quill lines -->
    <line x1="100" y1="185" x2="82" y2="85" stroke="#FFD700" stroke-width="0.8" opacity="0.4"/>
    <line x1="90" y1="178" x2="68" y2="78" stroke="#FFD700" stroke-width="0.6" opacity="0.3"/>
  </g>
  <!-- FEATHERS on mask (right) -->
  <g opacity="0.95">
    <path d="M300 185 Q330 130 320 80 Q305 110 290 160" fill="url(#mRed)"/>
    <path d="M310 178 Q345 125 332 72 Q315 105 300 155" fill="#C41E3A" opacity="0.7"/>
    <path d="M290 175 Q315 120 305 75 Q292 105 282 152" fill="#8B0000" opacity="0.6"/>
    <line x1="300" y1="185" x2="318" y2="85" stroke="#FFD700" stroke-width="0.8" opacity="0.4"/>
    <line x1="310" y1="178" x2="332" y2="78" stroke="#FFD700" stroke-width="0.6" opacity="0.3"/>
  </g>

  <!-- Nose (subtle, below mask) -->
  <path d="M196 265 Q200 280 204 265" fill="none" stroke="#C4956A" stroke-width="1.5" opacity="0.4"/>
  <circle cx="195" cy="275" r="2" fill="#D4A57A" opacity="0.3"/>
  <circle cx="205" cy="275" r="2" fill="#D4A57A" opacity="0.3"/>

  <!-- Lips -->
  <path d="M180 300 Q190 293 200 295 Q210 293 220 300" fill="url(#lip)"/>
  <path d="M180 300 Q200 310 220 300" fill="url(#lip)" opacity="0.9"/>
  <path d="M190 297 Q200 294 210 297" fill="none" stroke="#FFF" stroke-width="0.8" opacity="0.3"/>

  <!-- Shoulders / dress top -->
  <path d="M60 430 Q100 390 160 380 Q180 375 200 373 Q220 375 240 380 Q300 390 340 430 L360 500 L40 500Z" fill="url(#dress)"/>
  <!-- Dress neckline -->
  <path d="M140 410 Q170 385 200 382 Q230 385 260 410" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.6"/>
  <path d="M145 415 Q175 390 200 387 Q225 390 255 415" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.3"/>
  <!-- Necklace -->
  <path d="M155 370 Q175 380 200 383 Q225 380 245 370" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <circle cx="200" cy="383" r="4" fill="#C41E3A" stroke="#FFD700" stroke-width="1"/>
  <circle cx="182" cy="379" r="2" fill="#FFD700" opacity="0.7"/>
  <circle cx="218" cy="379" r="2" fill="#FFD700" opacity="0.7"/>
</svg>