<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" fill="none">
  <defs>
    <linearGradient id="terno" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="ternoH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="tGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="tRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C41E3A"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
    <linearGradient id="shirt" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F5F5F5"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
  </defs>

  <!-- Shoulders -->
  <path d="M50 65 Q60 55 80 48 Q95 42 100 40 Q105 42 120 48 Q140 55 150 65 L155 75 L45 75Z" fill="url(#terno)" stroke="url(#tGold)" stroke-width="0.8"/>

  <!-- Jacket body -->
  <path d="M45 75 L40 200 Q40 210 50 212 L150 212 Q160 210 160 200 L155 75Z" fill="url(#terno)" stroke="url(#tGold)" stroke-width="0.8"/>

  <!-- Jacket lapels -->
  <path d="M75 75 L60 130 L75 135 L85 80Z" fill="url(#ternoH)" stroke="url(#tGold)" stroke-width="1"/>
  <path d="M125 75 L140 130 L125 135 L115 80Z" fill="url(#ternoH)" stroke="url(#tGold)" stroke-width="1"/>

  <!-- Shirt visible between lapels -->
  <path d="M85 80 L80 200 L120 200 L115 80Z" fill="url(#shirt)"/>

  <!-- Shirt buttons -->
  <circle cx="100" cy="100" r="2" fill="#D4AF37" opacity="0.6"/>
  <circle cx="100" cy="120" r="2" fill="#D4AF37" opacity="0.6"/>
  <circle cx="100" cy="140" r="2" fill="#D4AF37" opacity="0.6"/>
  <circle cx="100" cy="160" r="2" fill="#D4AF37" opacity="0.6"/>

  <!-- Bow tie -->
  <path d="M90 62 L100 58 L110 62 L100 66Z" fill="url(#tRed)"/>
  <circle cx="100" cy="62" r="3" fill="url(#tGold)"/>
  <path d="M88 60 L85 56" fill="none" stroke="url(#tRed)" stroke-width="2" stroke-linecap="round"/>
  <path d="M112 60 L115 56" fill="none" stroke="url(#tRed)" stroke-width="2" stroke-linecap="round"/>

  <!-- Collar -->
  <path d="M80 50 L85 65 L100 58 L115 65 L120 50" fill="none" stroke="url(#tGold)" stroke-width="1" opacity="0.5"/>

  <!-- Pocket square -->
  <path d="M130 95 L138 88 L145 95" fill="none" stroke="url(#tGold)" stroke-width="1" opacity="0.4"/>
  <path d="M132 95 L138 90 L143 95" fill="url(#tRed)" opacity="0.4"/>

  <!-- Jacket button -->
  <circle cx="100" cy="185" r="3" fill="url(#tGold)" opacity="0.5"/>

  <!-- Trousers -->
  <path d="M55 212 L50 310 L90 310 L95 230 Q100 225 105 230 L110 310 L150 310 L145 212Z" fill="url(#terno)" stroke="url(#tGold)" stroke-width="0.5"/>

  <!-- Trouser creases -->
  <path d="M72 220 L68 305" fill="none" stroke="url(#ternoH)" stroke-width="1" opacity="0.3"/>
  <path d="M128 220 L132 305" fill="none" stroke="url(#ternoH)" stroke-width="1" opacity="0.3"/>

  <!-- Trouser hem -->
  <line x1="50" y1="308" x2="90" y2="308" stroke="url(#tGold)" stroke-width="0.5" opacity="0.3"/>
  <line x1="110" y1="308" x2="150" y2="308" stroke="url(#tGold)" stroke-width="0.5" opacity="0.3"/>

  <!-- Small mask on lapel -->
  <path d="M65 100 Q65 96 70 95 Q73 94.5 76 95 Q80 96 80 100 Q80 104 76 105 Q73 106 70 105 Q65 104 65 100Z" fill="url(#tRed)" opacity="0.5"/>
  <ellipse cx="71" cy="100" rx="2" ry="1.3" fill="#0d0000" opacity="0.4"/>
  <ellipse cx="77" cy="100" rx="2" ry="1.3" fill="#0d0000" opacity="0.4"/>
</svg>