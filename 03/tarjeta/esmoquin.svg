<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" fill="none">
  <defs>
    <linearGradient id="mBlazer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E1530"/>
      <stop offset="0.45" stop-color="#2A3866"/>
      <stop offset="0.6" stop-color="#1F2B52"/>
      <stop offset="1" stop-color="#0B1026"/>
    </linearGradient>
    <linearGradient id="mLapel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34447A"/>
      <stop offset="1" stop-color="#16203F"/>
    </linearGradient>
    <linearGradient id="mShirt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9FC3E6"/><stop offset="0.5" stop-color="#D3E6F7"/><stop offset="1" stop-color="#97BCE0"/>
    </linearGradient>
    <linearGradient id="mChino" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A8957A"/><stop offset="0.5" stop-color="#CDBB9E"/><stop offset="1" stop-color="#9F8C71"/>
    </linearGradient>
    <linearGradient id="mLeather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A5B34"/>
      <stop offset="1" stop-color="#4E2A14"/>
    </linearGradient>
    <filter id="mShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3A0A24" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#mShadow)">
    <!-- pantalón chino -->
    <path d="M70 120 L130 120 L136 214 L106 214 L100 140 L94 214 L64 214 Z" fill="url(#mChino)"/>
    <rect x="70" y="116" width="60" height="8" rx="1.5" fill="url(#mLeather)"/>
    <rect x="96" y="115" width="9" height="10" rx="1.5" fill="none" stroke="#C9C9D2" stroke-width="1.4"/>
    <path d="M82 128 L78 212 M118 128 L122 212" stroke="#8C7A60" stroke-width="1" opacity="0.6"/>

    <!-- mangas del saco -->
    <path d="M52 30 C42 38 38 70 37 100 L36 116 L50 117 L52 98 Z" fill="url(#mBlazer)"/>
    <path d="M148 30 C158 38 162 70 163 100 L164 116 L150 117 L148 98 Z" fill="url(#mBlazer)"/>
    <path d="M36 111 L50 112 M164 111 L150 112" stroke="#D3E6F7" stroke-width="3"/>

    <!-- saco -->
    <path d="M52 30 C70 22 86 20 100 28 C114 20 130 22 148 30 L154 76 L150 112 L50 112 L46 76 Z" fill="url(#mBlazer)"/>

    <!-- camisa celeste, cuello abierto -->
    <path d="M84 28 L100 92 L116 28 C110 24 90 24 84 28 Z" fill="url(#mShirt)"/>
    <path d="M86 26 L94 44 L100 34 Z" fill="#E1EEFA" stroke="#8DB2D8" stroke-width="0.8"/>
    <path d="M114 26 L106 44 L100 34 Z" fill="#E1EEFA" stroke="#8DB2D8" stroke-width="0.8"/>
    <circle cx="100" cy="58" r="1.4" fill="#E9F2FB" stroke="#7FA6CC" stroke-width="0.5"/>
    <circle cx="100" cy="72" r="1.4" fill="#E9F2FB" stroke="#7FA6CC" stroke-width="0.5"/>

    <!-- solapas -->
    <path d="M84 28 L100 92 L92 100 L68 62 L76 42 L70 36 Z" fill="url(#mLapel)"/>
    <path d="M116 28 L100 92 L108 100 L132 62 L124 42 L130 36 Z" fill="url(#mLapel)"/>

    <!-- botones y bolsillos -->
    <path d="M100 100 L100 112" stroke="#0B1026" stroke-width="1.2"/>
    <circle cx="102" cy="104" r="2.4" fill="#3A4A7E" stroke="#6A7AB0" stroke-width="0.6"/>
    <path d="M124 64 L140 64" stroke="#16203F" stroke-width="1.4"/>
    <path d="M126 64 L130 58 L134 63 L138 59 L138 64 Z" fill="#D3E6F7"/>

    <!-- mocasines -->
    <path d="M30 236 C30 226 44 222 58 224 L84 230 C90 232 90 240 84 240 L36 240 C32 240 30 239 30 236 Z" fill="url(#mLeather)"/>
    <path d="M46 228 C54 226 62 228 66 232" stroke="#2E170A" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M110 236 C110 226 124 222 138 224 L164 230 C170 232 170 240 164 240 L116 240 C112 240 110 239 110 236 Z" fill="url(#mLeather)" opacity="0.92"/>
    <path d="M126 228 C134 226 142 228 146 232" stroke="#2E170A" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>
