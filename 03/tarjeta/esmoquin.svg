<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 8 180 236" fill="none">
  <defs>
    <linearGradient id="mBlazer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E1530"/>
      <stop offset="0.45" stop-color="#2E3D72"/>
      <stop offset="0.6" stop-color="#22305C"/>
      <stop offset="1" stop-color="#0B1026"/>
    </linearGradient>
    <linearGradient id="mLapel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B4D88"/>
      <stop offset="1" stop-color="#16203F"/>
    </linearGradient>
    <linearGradient id="mShirt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A2C6E8"/><stop offset="0.5" stop-color="#DCEBF9"/><stop offset="1" stop-color="#97BCE0"/>
    </linearGradient>
    <linearGradient id="mChino" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A9967B"/><stop offset="0.5" stop-color="#D3C2A6"/><stop offset="1" stop-color="#9C8A6F"/>
    </linearGradient>
    <linearGradient id="mLeather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8673D"/>
      <stop offset="1" stop-color="#4E2A14"/>
    </linearGradient>
    <filter id="mShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#5A1030" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#mShadow)" stroke-linejoin="round" stroke-linecap="round">
    <!-- pantalón de vestir beige con raya -->
    <path d="M68 118 L132 118 L138 210 L106 210 L100 138 L94 210 L62 210 Z" fill="url(#mChino)" stroke="#5E4E37" stroke-width="1.5"/>
    <path d="M81 128 L77 208 M119 128 L123 208" stroke="#857258" stroke-width="1.1"/>
    <path d="M100 138 L100 122" stroke="#5E4E37" stroke-width="1.2"/>
    <path d="M72 124 L84 130 M128 124 L116 130" stroke="#857258" stroke-width="1"/>
    <!-- cinturón -->
    <rect x="68" y="114" width="64" height="8" rx="1.5" fill="url(#mLeather)" stroke="#2E170A" stroke-width="1.2"/>
    <rect x="95" y="113" width="10" height="10" rx="1.5" fill="none" stroke="#D9D9E2" stroke-width="1.6"/>

    <!-- mangas del saco -->
    <path d="M50 28 C40 36 36 68 35 98 L34 114 L50 115 L52 96 Z" fill="url(#mBlazer)" stroke="#070B1C" stroke-width="1.5"/>
    <path d="M150 28 C160 36 164 68 165 98 L166 114 L150 115 L148 96 Z" fill="url(#mBlazer)" stroke="#070B1C" stroke-width="1.5"/>
    <path d="M34 109 L50 110 M166 109 L150 110" stroke="#DCEBF9" stroke-width="3.2"/>
    <circle cx="44" cy="104" r="1.3" fill="#6A7AB0"/><circle cx="156" cy="104" r="1.3" fill="#6A7AB0"/>

    <!-- saco -->
    <path d="M50 28 C68 20 86 18 100 26 C114 18 132 20 150 28 L156 74 L152 112 L48 112 L44 74 Z" fill="url(#mBlazer)" stroke="#070B1C" stroke-width="1.6"/>

    <!-- camisa celeste con cuello abierto -->
    <path d="M84 26 L100 92 L116 26 C110 22 90 22 84 26 Z" fill="url(#mShirt)" stroke="#6F96BF" stroke-width="1"/>
    <path d="M86 24 L94 44 L100 32 Z" fill="#E6F1FB" stroke="#7FA6CC" stroke-width="1"/>
    <path d="M114 24 L106 44 L100 32 Z" fill="#E6F1FB" stroke="#7FA6CC" stroke-width="1"/>
    <circle cx="100" cy="56" r="1.5" fill="#F4F9FD" stroke="#7FA6CC" stroke-width="0.6"/>
    <circle cx="100" cy="70" r="1.5" fill="#F4F9FD" stroke="#7FA6CC" stroke-width="0.6"/>

    <!-- solapas con pespunte -->
    <path d="M84 26 L100 92 L92 100 L66 60 L76 40 L68 34 Z" fill="url(#mLapel)" stroke="#070B1C" stroke-width="1.3"/>
    <path d="M116 26 L100 92 L108 100 L134 60 L124 40 L132 34 Z" fill="url(#mLapel)" stroke="#070B1C" stroke-width="1.3"/>
    <path d="M80 40 L73 58 L93 92" stroke="#5B6DA8" stroke-width="0.8" stroke-dasharray="2 2"/>
    <path d="M120 40 L127 58 L107 92" stroke="#5B6DA8" stroke-width="0.8" stroke-dasharray="2 2"/>

    <!-- cierre, botones y bolsillos -->
    <path d="M100 100 L100 112" stroke="#070B1C" stroke-width="1.3"/>
    <circle cx="102" cy="104" r="2.6" fill="#3A4A7E" stroke="#8A9AD0" stroke-width="0.7"/>
    <path d="M122 64 L140 64" stroke="#070B1C" stroke-width="1.5"/>
    <path d="M125 64 L129 57 L133 62 L137 58 L138 64 Z" fill="#DCEBF9" stroke="#7FA6CC" stroke-width="0.6"/>
    <path d="M58 94 L82 94 M118 94 L142 94" stroke="#070B1C" stroke-width="1.5"/>

    <!-- mocasines -->
    <path d="M28 234 C28 223 42 219 57 221 L84 228 C91 230 91 238 84 238 L34 238 C30 238 28 237 28 234 Z" fill="url(#mLeather)" stroke="#2E170A" stroke-width="1.3"/>
    <path d="M44 226 C52 223 61 225 66 230" stroke="#2E170A" stroke-width="1.5"/>
    <path d="M34 236 L84 236" stroke="#2E170A" stroke-width="2"/>
    <path d="M110 234 C110 223 124 219 139 221 L166 228 C173 230 173 238 166 238 L116 238 C112 238 110 237 110 234 Z" fill="url(#mLeather)" stroke="#2E170A" stroke-width="1.3"/>
    <path d="M126 226 C134 223 143 225 148 230" stroke="#2E170A" stroke-width="1.5"/>
    <path d="M116 236 L166 236" stroke="#2E170A" stroke-width="2"/>
  </g>
</svg>
