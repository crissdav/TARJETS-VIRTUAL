<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 190" fill="none">
  <defs>
    <linearGradient id="tMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#F6D6E5"/>
      <stop offset="1" stop-color="#C88FAE"/>
    </linearGradient>
    <linearGradient id="tBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9A3C0"/>
    </linearGradient>
    <radialGradient id="tGem" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#FF9FCB"/>
      <stop offset="1" stop-color="#C2185B"/>
    </radialGradient>
    <radialGradient id="tPearl" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3C9DC"/>
    </radialGradient>
    <filter id="tShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7A1248" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#tShadow)">
    <!-- banda -->
    <path d="M28 152 Q150 118 272 152 L270 166 Q150 132 30 166 Z" fill="url(#tBand)" stroke="#C88FAE" stroke-width="1.5"/>

    <!-- cresta principal -->
    <path d="M38 150 C58 124 78 114 96 122 C100 102 112 88 124 96 C130 70 140 44 150 18 C160 44 170 70 176 96 C188 88 200 102 204 122 C222 114 242 124 262 150"
          stroke="url(#tMetal)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- filigrana interior -->
    <g stroke="url(#tMetal)" stroke-width="2.6" stroke-linecap="round">
      <path d="M150 128 C138 116 134 100 142 88 C148 80 158 84 156 92"/>
      <path d="M150 128 C162 116 166 100 158 88 C152 80 142 84 144 92"/>
      <path d="M96 136 C96 124 106 116 116 120 C124 124 120 134 112 132"/>
      <path d="M204 136 C204 124 194 116 184 120 C176 124 180 134 188 132"/>
      <path d="M58 144 C62 134 72 130 80 134"/>
      <path d="M242 144 C238 134 228 130 220 134"/>
      <path d="M124 126 C120 112 124 104 130 100"/>
      <path d="M176 126 C180 112 176 104 170 100"/>
    </g>

    <!-- gema central en gota -->
    <path d="M150 50 C162 66 166 78 160 88 C156 94 144 94 140 88 C134 78 138 66 150 50 Z" fill="url(#tGem)" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M146 64 C144 70 144 76 147 80" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>

    <!-- gemas laterales -->
    <ellipse cx="110" cy="112" rx="7" ry="9" fill="url(#tGem)" stroke="#FFFFFF" stroke-width="1.6"/>
    <ellipse cx="190" cy="112" rx="7" ry="9" fill="url(#tGem)" stroke="#FFFFFF" stroke-width="1.6"/>
    <circle cx="74" cy="132" r="5" fill="url(#tGem)" stroke="#FFFFFF" stroke-width="1.4"/>
    <circle cx="226" cy="132" r="5" fill="url(#tGem)" stroke="#FFFFFF" stroke-width="1.4"/>

    <!-- perlas en las puntas -->
    <circle cx="150" cy="16" r="7" fill="url(#tPearl)" stroke="#E6B3CC" stroke-width="1"/>
    <circle cx="124" cy="94" r="5" fill="url(#tPearl)" stroke="#E6B3CC" stroke-width="1"/>
    <circle cx="176" cy="94" r="5" fill="url(#tPearl)" stroke="#E6B3CC" stroke-width="1"/>
    <circle cx="96" cy="120" r="4.5" fill="url(#tPearl)" stroke="#E6B3CC" stroke-width="1"/>
    <circle cx="204" cy="120" r="4.5" fill="url(#tPearl)" stroke="#E6B3CC" stroke-width="1"/>

    <!-- pedrería en la banda -->
    <g fill="#FFFFFF">
      <circle cx="60" cy="150" r="2.4"/><circle cx="82" cy="145" r="2.4"/><circle cx="104" cy="141" r="2.4"/>
      <circle cx="127" cy="138" r="2.4"/><circle cx="150" cy="137" r="3"/><circle cx="173" cy="138" r="2.4"/>
      <circle cx="196" cy="141" r="2.4"/><circle cx="218" cy="145" r="2.4"/><circle cx="240" cy="150" r="2.4"/>
    </g>
    <g fill="#E0287F" opacity="0.8">
      <circle cx="71" cy="148" r="1.6"/><circle cx="93" cy="143" r="1.6"/><circle cx="116" cy="139" r="1.6"/>
      <circle cx="139" cy="137" r="1.6"/><circle cx="161" cy="137" r="1.6"/><circle cx="184" cy="139" r="1.6"/>
      <circle cx="207" cy="143" r="1.6"/><circle cx="229" cy="148" r="1.6"/>
    </g>
  </g>

  <!-- destellos -->
  <g fill="#FFFFFF">
    <path d="M150 0 L152 10 L162 12 L152 14 L150 24 L148 14 L138 12 L148 10 Z" opacity="0.9"/>
    <path d="M168 58 L169.5 64 L176 65.5 L169.5 67 L168 73 L166.5 67 L160 65.5 L166.5 64 Z" opacity="0.8"/>
    <path d="M88 104 L89 108 L93 109 L89 110 L88 114 L87 110 L83 109 L87 108 Z" opacity="0.7"/>
  </g>
</svg>
