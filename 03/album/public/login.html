<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicia sesión — Álbum XV de Grecia Peña</title>
<meta name="theme-color" content="#8B0000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }

  .login-card {
    max-width: 380px;
    width: 100%;
    padding: 2.5rem 2rem;
    text-align: center;
  }

  .login-card h1 {
    font-family: 'Cinzel', serif;
    font-size: 1.3rem;
    letter-spacing: 0.08em;
    color: var(--dorado-light);
    margin-bottom: 0.3rem;
  }

  .login-card .sub {
    font-style: italic;
    color: var(--gris-light);
    margin-bottom: 1.75rem;
    font-size: 1rem;
  }

  .login-card input[type="password"] {
    width: 100%;
    padding: 0.8rem 1rem;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    color: var(--blanco);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    outline: none;
    text-align: center;
    letter-spacing: 0.15em;
    transition: border-color 0.3s;
    margin-bottom: 1.25rem;
  }

  .login-card input[type="password"]:focus {
    border-color: var(--dorado);
  }

  .error-msg {
    min-height: 1.4rem;
    color: var(--rojo-light, #E85D5D);
    font-size: 0.95rem;
    margin-bottom: 0.8rem;
  }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card glass-card">
    <span class="eyebrow">Álbum en tiempo real</span>
    <h1>Álbum XV — Grecia Peña</h1>
    <p class="sub">Solo para la quinceañera</p>
    <form id="formLogin">
      <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
      <button class="btn" id="btnLogin" type="submit" style="width:100%;">Entrar al álbum</button>
      <p class="error-msg" id="error"></p>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  (function () {
    const form = document.getElementById('formLogin');
    const pass = document.getElementById('password');
    const btn = document.getElementById('btnLogin');
    const error = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!pass.value) {
        error.textContent = 'Escribe la contraseña';
        return;
      }
      btn.disabled = true;
      error.textContent = '';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pass.value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error');
        location.href = '/album';
      } catch (err) {
        error.textContent = err.message;
      }
      btn.disabled = false;
    });
  })();
</script>
</body>
</html>
