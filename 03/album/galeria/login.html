<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Álbum privado · XV Años de Grecia</title>
  <meta name="theme-color" content="#8B0000">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="mascara-icono.svg">
</head>
<body>

<div class="bg-decor" id="bgDecor" aria-hidden="true"></div>

<div class="login-page">
  <div class="login-card">
    <svg class="login-mask" viewBox="0 0 120 80" aria-hidden="true">
      <defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFD700"/><stop offset="100%" stop-color="#B8860B"/></linearGradient></defs>
      <path d="M15 40 Q15 22 35 18 Q50 15 60 22 Q70 15 85 18 Q105 22 105 40 Q105 55 90 60 Q80 65 60 60 Q40 65 30 60 Q15 55 15 40Z" fill="url(#g)" stroke="#8B6914" stroke-width="1.5"/>
      <ellipse cx="42" cy="37" rx="10" ry="7" fill="#0d0000"/><ellipse cx="78" cy="37" rx="10" ry="7" fill="#0d0000"/>
      <path d="M57 30 L60 22 L63 30 L60 33Z" fill="#C41E3A"/>
      <path d="M25 25 Q15 10 20 2 Q28 8 30 20" fill="#C41E3A" opacity="0.8"/>
      <path d="M95 25 Q105 10 100 2 Q92 8 90 20" fill="#C41E3A" opacity="0.8"/>
    </svg>
    <h1 class="login-title">Mi Álbum de Fotos</h1>
    <p class="login-sub">Álbum privado · Solo Grecia puede entrar</p>

    <form class="login-form" id="loginForm" autocomplete="off">
      <div class="field">
        <label class="field-label" for="email">Correo</label>
        <input class="input input-pass" type="email" id="email" placeholder="tu@correo.com" required>
      </div>
      <div class="field">
        <label class="field-label" for="pass">Contraseña</label>
        <input class="input input-pass" type="password" id="pass" placeholder="••••••••" required>
      </div>
      <button class="btn" type="submit" id="btnEntrar">Entrar</button>
    </form>

    <p class="login-error" id="error"></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="login.js"></script>
</body>
</html>
