<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Acceso · Lista de invitados</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="login">
  <div class="login-card">
    <img class="login-ico" src="favicon.svg" alt="" aria-hidden="true">
    <p class="eyebrow">Lista de invitados</p>
    <h1 class="login-titulo" id="novios">Nuestra boda</h1>
    <p class="login-sub">Acceso solo para los novios</p>

    <form id="loginForm" autocomplete="on">
      <label class="campo">
        <span>Correo</span>
        <input class="input" type="email" id="email" autocomplete="username" required>
      </label>
      <label class="campo">
        <span>Contraseña</span>
        <input class="input" type="password" id="pass" autocomplete="current-password" required>
      </label>
      <button class="btn btn-ancho" type="submit" id="btnEntrar">Entrar</button>
    </form>
    <p class="login-error" id="error" role="alert"></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="login.js"></script>
</body>
</html>
